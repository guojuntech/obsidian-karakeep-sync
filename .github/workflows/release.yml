name: Release Obsidian plugin

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - package.json
      - package-lock.json
      - versions.json
      - .github/workflows/release.yml
      - scripts/package-release.mjs
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild (leave empty to publish the selected branch version)'
        required: false
        default: ''

concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Validate version and release target
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          version=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = path => JSON.parse(fs.readFileSync(path, 'utf8'));
          const manifest = read('manifest.json');
          const pkg = read('package.json');
          const lock = read('package-lock.json');
          if (!/^\d+\.\d+\.\d+$/.test(manifest.version)) throw new Error('Expected version x.y.z');
          if ([pkg.version, lock.version, lock.packages[''].version].some(v => v !== manifest.version)) {
            throw new Error('manifest, package and lockfile versions must match');
          }
          console.log(manifest.version);
          NODE
          )
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "$version" ]; then
            echo "Requested tag must match manifest version" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Pushed tag must match manifest version" >&2
            exit 1
          fi
          # A duplicate push/manual retry must not replace an already published release.
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if printf '%s\n' "$releases" | grep -Fxq "$version"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $version already exists; nothing to publish."
          else
            if git show-ref --verify --quiet "refs/tags/$version"; then
              test "$(git rev-parse "$version^{commit}")" = "$(git rev-parse HEAD)" || {
                echo "Version tag already points to a different commit; bump the version" >&2
                exit 1
              }
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: npm test -- --runInBand

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build

      - name: Package release
        if: steps.version.outputs.publish == 'true'
        run: node scripts/package-release.mjs

      - name: Preserve build artifacts
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: karakeep-sync-${{ steps.version.outputs.tag }}
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
            dist/karakeep-sync-*.zip
          if-no-files-found: error

      - name: Create tag and publish release
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --latest \
            dist/main.js dist/manifest.json dist/styles.css "dist/karakeep-sync-$RELEASE_TAG.zip"
