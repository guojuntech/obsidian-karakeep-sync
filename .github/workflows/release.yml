name: Release Obsidian plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and publish"
        required: true
        default: "2.0.4"
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Package manual installation archive
        run: |
          python3 - <<'PYZIP'
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          version = json.loads(Path("dist/manifest.json").read_text())["version"]
          with ZipFile(f"karakeep-sync-{version}.zip", "w", ZIP_DEFLATED) as archive:
              for name in ("main.js", "manifest.json", "styles.css"):
                  archive.write(Path("dist") / name, f"hoarder-sync/{name}")
          PYZIP

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          test "$(node -p "require('./dist/manifest.json').version")" = "$tag"

          gh release create "$tag" \
            --verify-tag \
            --title="$tag" \
            --generate-notes \
            dist/main.js dist/manifest.json dist/styles.css "karakeep-sync-$tag.zip"
